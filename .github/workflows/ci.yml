name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy server env so typecheck/tests/build validate the wiring
      # without live credentials. No real secrets here.
      DATABASE_URL: postgresql://user:password@localhost:5432/aventra_accounting_test
      BETTER_AUTH_URL: http://localhost:1988
      BETTER_AUTH_SECRET: ci-secret-placeholder-0000000000000000
      RESEND_API_KEY: ci-placeholder-not-a-real-key
      RESEND_FROM_EMAIL: Aventra <no-reply@aventra.app>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The generated Prisma client is gitignored; build it before any
      # step that typechecks or imports it (DATABASE_URL above is dummy —
      # generate never connects).
      - run: npx prisma generate
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx prisma validate
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aventra
          POSTGRES_PASSWORD: aventra
          POSTGRES_DB: aventra_accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aventra"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://aventra:aventra@localhost:5432/aventra_accounting_test
      BETTER_AUTH_URL: http://localhost:1988
      BETTER_AUTH_SECRET: ci-e2e-secret-placeholder-0000000000
      # Deterministic test-mail strategy: the E2E suite stubs Resend via
      # a local adapter, so no production credentials are used here.
      RESEND_API_KEY: ci-placeholder-not-a-real-key
      RESEND_FROM_EMAIL: Aventra <no-reply@aventra.app>
      E2E_TEST_MAIL: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm run test:e2e
